version: '3.8'

services:
  postbank-scrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postbank-scrapper
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      # PocketBase 설정 (필수)
      - PB_URL=${PB_URL}
      - PB_USER=${PB_USER}
      - PB_PASS=${PB_PASS}
      # 선택사항
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:-8}
      - DEFAULT_INTERVAL=${DEFAULT_INTERVAL:-60}
    volumes:
      # 로그 볼륨 (선택사항)
      - ./logs:/app/logs
    networks:
      - app-network
    # 리소스 제한 (가볍게 실행됨)
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    # 로깅 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    name: app-network
    external: true
